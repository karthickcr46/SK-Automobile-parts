
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Details | SK Automobile Parts</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .phone-box {
            background: #f1f3f5;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .phone-box strong {
            color: #111;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 18px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #111;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #333;
        }

        .error {
            background: #ffe5e5;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row > div {
            flex: 1;
        }

        @media (max-width: 600px) {
            .container {
                width: 94%;
                margin: 25px auto;
            }

            .card {
                padding: 25px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Customer Details</h1>

        <p class="subtitle">
            Your mobile number is not registered.
            Please enter your details to continue.
        </p>

        <!-- Mobile number -->
        <div class="phone-box">
            Mobile Number:
            <strong>{{ phone }}</strong>
        </div>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <!-- Name -->
            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <!-- Email -->
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <!-- Address -->
            <label for="address">Address</label>

            <textarea
                id="address"
                name="address"
                placeholder="Enter your address"
                required
            ></textarea>

            <!-- City and State -->
            <div class="row">

                <div>
                    <label for="city">City</label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter city"
                        required
                    >
                </div>

                <div>
                    <label for="state">State</label>

                    <input
                        type="text"
                        id="state"
                        name="state"
                        placeholder="Enter state"
                        required
                    >
                </div>

            </div>

            <!-- Pincode -->
            <label for="pincode">Pincode</label>

            <input
                type="text"
                id="pincode"
                name="pincode"
                placeholder="Enter pincode"
                maxlength="10"
                required
            >

            <button type="submit" class="btn">
                Continue to Website
            </button>
        
            
        </form>

    </div>

</div>

</body>
</html>
