<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payment - SK Automobile Parts</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f5f7fb;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;

        }


        .payment-container {

            width: 100%;

            max-width: 500px;

            background: white;

            padding: 35px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.1);

        }


        .header {

            text-align: center;

            margin-bottom: 30px;

        }


        .header h1 {

            font-size: 28px;

            margin-bottom: 8px;

        }


        .header p {

            color: #6b7280;

        }


        .amount {

            text-align: center;

            background: #f8fafc;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 25px;

        }


        .amount-label {

            color: #6b7280;

            font-size: 14px;

        }


        .amount-value {

            font-size: 32px;

            font-weight: 700;

            margin-top: 5px;

        }


        .payment-option {

            display: block;

            padding: 16px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            margin-bottom: 12px;

            cursor: pointer;

        }


        .payment-option:hover {

            border-color: #2563eb;

            background: #f8fafc;

        }


        .payment-option input {

            margin-right: 10px;

        }


        .payment-title {

            font-weight: 700;

        }


        .payment-description {

            display: block;

            margin-left: 25px;

            margin-top: 5px;

            color: #6b7280;

            font-size: 13px;

        }


        .pay-button {

            width: 100%;

            border: none;

            padding: 15px;

            margin-top: 15px;

            background: #16a34a;

            color: white;

            font-size: 17px;

            font-weight: 700;

            border-radius: 9px;

            cursor: pointer;

        }


        .pay-button:hover {

            background: #15803d;

        }


        .error {

            background: #fee2e2;

            color: #991b1b;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

        }


        .demo-notice {

            margin-top: 20px;

            padding: 12px;

            background: #fff7ed;

            border: 1px solid #fed7aa;

            border-radius: 8px;

            color: #9a3412;

            font-size: 13px;

            line-height: 1.5;

        }


        .back-link {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #2563eb;

            text-decoration: none;

        }

    </style>

</head>


<body>


<div class="payment-container">


    <div class="header">

        <h1>
            Secure Payment
        </h1>

        <p>
            SK Automobile Parts
        </p>

    </div>


    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}


    <!-- ========================================= -->
    <!-- AMOUNT -->
    <!-- ========================================= -->

    <div class="amount">

        <div class="amount-label">

            Amount to Pay

        </div>


        <div class="amount-value">

            ₹{{ total }}

        </div>

    </div>


    <!-- ========================================= -->
    <!-- PAYMENT FORM -->
    <!-- ========================================= -->

    <form method="POST">

        {% csrf_token %}


        <label class="payment-option">

            <input
                type="radio"
                name="payment_method"
                value="UPI"

                {% if payment_method == "UPI" %}
                    checked
                {% endif %}

                required
            >

            <span class="payment-title">
                📱 UPI
            </span>

            <span class="payment-description">

                Pay using UPI.

            </span>

        </label>


        <label class="payment-option">

            <input
                type="radio"
                name="payment_method"
                value="CARD"

                {% if payment_method == "CARD" %}
                    checked
                {% endif %}
            >

            <span class="payment-title">
                💳 Credit / Debit Card
            </span>

            <span class="payment-description">

                Pay using your card.

            </span>

        </label>


        <label class="payment-option">

            <input
                type="radio"
                name="payment_method"
                value="NET_BANKING"

                {% if payment_method == "NET_BANKING" %}
                    checked
                {% endif %}
            >

            <span class="payment-title">
                🏦 Net Banking
            </span>

            <span class="payment-description">

                Pay using your bank account.

            </span>

        </label>


        <button
            type="submit"
            class="pay-button"
        >

            Pay ₹{{ total }}

        </button>


    </form>


    <div class="demo-notice">

        <strong>Demo Payment:</strong>

        This is a demonstration payment page.
        No real money will be charged.

    </div>


    <a
        href="{% url 'checkout' %}"
        class="back-link"
    >

        ← Back to Checkout

    </a>


</div>


</body>

</html>
