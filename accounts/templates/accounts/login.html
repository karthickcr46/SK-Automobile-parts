<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login | SK Automobile Parts</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand h1 {
            font-size: 28px;
            color: #111827;
            margin-bottom: 6px;
        }

        .brand p {
            color: #6b7280;
            font-size: 14px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .login-card h2 {
            color: #111827;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .login-card .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .error-message {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 11px 13px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .register-section {
            text-align: center;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .register-section p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .register-section a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .register-section a:hover {
            text-decoration: underline;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }

        .home-link:hover {
            color: #111827;
        }

        @media (max-width: 480px) {

            .login-card {
                padding: 25px 20px;
            }

            .brand h1 {
                font-size: 24px;
            }
        }

    </style>
</head>

<body>

<div class="login-container">

    <!-- BRAND -->

    <div class="brand">

        <h1>
            SK Automobile Parts
        </h1>

        <p>
            Your trusted motorcycle parts store
        </p>

    </div>


    <!-- LOGIN CARD -->

    <div class="login-card">

        <h2>
            Welcome Back
        </h2>

        <p class="subtitle">
            Login to access your account and orders.
        </p>


        <!-- ERROR MESSAGE -->

        {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form method="POST">

            {% csrf_token %}

            <!--
                If the customer was sent to Login
                from Cart / Checkout / another protected page,
                remember the original destination.
            -->

            {% if request.GET.next %}

                <input
                    type="hidden"
                    name="next"
                    value="{{ request.GET.next }}"
                >

            {% endif %}


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>


        <!-- REGISTER -->

        <div class="register-section">

            <p>
                Don't have an account?
            </p>

            <a href="{% url 'register' %}">
                Create a new account
            </a>

        </div>

    </div>


    <!-- BACK TO WEBSITE -->

    <a
        href="{% url 'home' %}"
        class="home-link"
    >
        ← Back to SK Automobile Parts
    </a>

</div>

</body>
</html>
